name: Change Management Backend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pylint bandit

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test deps
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          mkdir -p reports/coverage-html
      - name: Run tests
        working-directory: ./backend
        run: |
          pytest -v --maxfail=1 --disable-warnings --cov=src --cov-report=term

  lint:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pylint
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pylint -r requirements.txt
      - name: Lint with pylint
        working-directory: ./backend
        run: |
          pylint src || true

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install bandit
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install bandit -r requirements.txt
          mkdir -p reports
      - name: Bandit security scan
        working-directory: ./backend
        run: |
          bandit -r src -f json -o reports/security.json || true
